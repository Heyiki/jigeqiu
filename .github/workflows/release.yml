name: Release Web and Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            assert.match(process.env.RELEASE_TAG, /^v\d+\.\d+\.\d+$/);
            assert.equal(process.env.RELEASE_TAG, `v${version}`);
          '
      - run: npm ci
      - run: npm run check
      - name: Package static website
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/package-release.mjs "$RELEASE_TAG"
      - name: Build and package extension
        run: npm run package:extension
      - name: Prepare both release packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG"
      - name: Verify both package checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Upload, verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG" --publish
