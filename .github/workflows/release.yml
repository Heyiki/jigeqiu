name: Release Web Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.2
          cache: npm
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            assert.match(process.env.RELEASE_TAG, /^v\d+\.\d+\.\d+$/);
            assert.equal(process.env.RELEASE_TAG, `v${version}`);
          '
      - run: npm ci
      - run: npm run check
      - name: Package static website
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/package-release.mjs "$RELEASE_TAG"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release-assets/jigeqiu-${RELEASE_TAG}-web.zip" \
            release-assets/SHA256SUMS.txt \
            --verify-tag --draft --title "JIGEQIU ${RELEASE_TAG}" \
            --notes "Static website package. Extract the ZIP into your web root. No Node.js runtime or database is required. See README for deployment instructions."
