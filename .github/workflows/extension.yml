name: Package Browser Extension

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test extension packaging
        run: npm run test:extension
      - name: Build and package extension
        run: npm run package:extension
      - name: Verify package checksum
        working-directory: release-extension
        run: sha256sum --check SHA256SUMS.txt
      - name: Upload extension ZIP and checksum
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jigeqiu-extension-${{ github.sha }}
          path: |
            release-extension/jigeqiu-extension-*.zip
            release-extension/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
