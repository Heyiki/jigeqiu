name: Package Browser Extension

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.2
          cache: npm
      - run: npm ci
      - name: Test extension packaging
        run: npm run test:extension
      - name: Build and package extension
        run: npm run package:extension
      - name: Verify package checksum
        working-directory: release-extension
        run: sha256sum --check SHA256SUMS.txt
      - name: Upload extension ZIP and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jigeqiu-extension-${{ github.sha }}
          path: |
            release-extension/jigeqiu-extension-*.zip
            release-extension/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
